      value: |
        <h2>Getting started with testing the Chrome Browser Prompt API</h2>
        <p>Explore a demo that combines Drupal CMS features with a small AI model that runs locally in your browser. With the Prompt API and Gemini Nano, you can test Drupal AI features without costly API keys.</p>
        <p>This is sovereign AI: private, local-first, and built on open source foundations. Because this runs on your machine, 16GB RAM is recommended and quality may differ from frontier hosted models.</p>
        <h3>One-time setup</h3>
        <h4>Download Gemini Nano</h4>
        <p>If this is your first time, allow the model download when Chrome prompts you.</p>
        <p><img src="/sites/default/files/setup-download-model.png" alt="Chrome Prompt API model download pop-up" style="max-width: 100%; height: auto;" /></p>
        <h4>Running on your own host</h4>
        <p>This demo host is already registered for the Chrome origin trial. On your own host, register your domain for the required trial or enable the required flags in <code>chrome://flags</code>.</p>
        <p><img src="/sites/default/files/setup-enable-flags.png" alt="Chrome flags needed for Prompt API features" style="max-width: 100%; height: auto;" /></p>
        <h3>Demo features and how to test</h3>
        <h4>1) Log in and open content</h4>
        <p>Use username <strong>admin</strong> and password <strong>admin</strong>. Then click <strong>Content</strong>, open or create a Blog Post, and add sample text.</p>
        <p><img src="/sites/default/files/walkthrough-content.png" alt="Drupal content listing screen" style="max-width: 100%; height: auto;" /></p>
        <h4>2) Generate alt text</h4>
        <p>Upload an image and use the image field action to generate alt text using Browser AI.</p>
        <p><img src="/sites/default/files/walkthrough-generate-alt-text.png" alt="Generate alt text button on image field" style="max-width: 100%; height: auto;" /></p>
        <h4>3) Use CKEditor assistants</h4>
        <p>Highlight text and test assistant actions: Summarise, Translate, and Tone change.</p>
        <p><img src="/sites/default/files/walkthrough-ai-assistant-list.png" alt="AI assistant action list in CKEditor" style="max-width: 100%; height: auto;" /></p>
        <p><img src="/sites/default/files/walkthrough-ai-assistant-language.png" alt="Language chooser for CKEditor translate assistant" style="max-width: 100%; height: auto;" /></p>
        <h4>4) Use local-only browser AI actions</h4>
        <p>Highlight text and use local AI actions, such as summarise or proofread, directly in the editor.</p>
        <p><img src="/sites/default/files/walkthrough-local-ai-summarise.png" alt="Local AI summarise action in CKEditor" style="max-width: 100%; height: auto;" /></p>
        <h4>5) Summarise into the Summary field</h4>
        <p>Use <strong>Summarize with Google Chrome Provider</strong> to populate the summary field.</p>
        <p><img src="/sites/default/files/walkthrough-summary.png" alt="Summary generation action in blog post form" style="max-width: 100%; height: auto;" /></p>
        <h4>6) Translate content</h4>
        <p>Save the node, open the <strong>Translate</strong> tab, and translate between English and French.</p>
        <p><img src="/sites/default/files/walkthrough-translate.png" alt="Translate tab and translation workflow" style="max-width: 100%; height: auto;" /></p>
        <p>If you want to add more languages, use Configuration &gt; Region and Language &gt; Languages.</p>
      format: chrome_test
