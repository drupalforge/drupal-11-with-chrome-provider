  field_blog_post:
    -
      value: '<h2>Welcome to the Chrome Prompt API demo</h2><p>This tutorial is the first page after login. Follow the steps below to test each feature quickly.</p><h3>One-time setup</h3><p>If Chrome asks you to download Gemini Nano, allow the download before testing features.</p><h3>Demo credentials</h3><p>For demo environments use username <strong>admin</strong> and password <strong>admin</strong>.</p><h3>Feature walkthrough</h3><ol><li>Go to <strong>Content</strong> and open or create a Blog Post.</li><li>Upload an image and use the image action to generate alt text.</li><li>In the main editor, highlight text and use AI Assistant actions such as summarize, translate, and change tone.</li><li>Use the local browser AI editor buttons to summarize or proofread selected text.</li><li>Use <strong>Summarize with Google Chrome Provider</strong> for the Summary field.</li><li>Save content, open the <strong>Translate</strong> tab, and translate between English and French.</li></ol><p>Need another language? Go to Configuration &gt; Region and Language &gt; Languages.</p><p><a href="/admin/content">Open Content</a></p>'
      format: chrome_test
